# Shared base for every spec in this repository (mozilla).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# The fleet rule, and NOT the flat layout's `build_timestamp: none` — which
# predates it and which `package validate` warns about by name: a cascade tag
# (`latest`, `X`, `X.Y`) re-points on every re-publish, and without a build
# segment the new manifest reuses the bare version tag and orphans the prior
# digest for registry GC, breaking any `@sha256:` pin in a consumer's ocx.lock.
# The `none` exception is for upstream versions that already carry a
# `+YYYYMMDD` segment, where `date` empties the mirror; sccache's tag_pattern
# admits bare semver only, so it cannot apply here. Nothing is published at the
# grouped coordinate yet, so the change costs no orphaned digest.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are ~5-10 MB tarballs holding one static binary.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>. Upstream's tarball is
# `sccache-v<v>-<target>/{sccache,LICENSE,README.md}` — a version- and
# target-stamped wrapper with NO bin/ subdirectory — so `strip_components: 1`
# puts the executable at the content root and PATH is a bare ${installPath}.
# (Not stripping is not an alternative: the wrapper's name changes with every
# version and platform, so no static metadata.json could name it.) `auto` or
# `verify` on that shape is rejected at spec load with exit 65 ("bin_scan is
# enabled but … declares no interface-visible ${installPath}/<dir> PATH
# entry"); `off` plus a hand-listed `binaries` in metadata.json is the blessed
# shape. A future package here shipping a real bin/ dir should override this to
# `verify`.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Upstream builds sccache's Linux binaries against
# musl and links them fully STATICALLY: measured on v0.17.0, neither arch has a
# PT_INTERP or a single DT_NEEDED (evidence above sccache/mirror.yml's
# `assets:`). A static binary requires no loader, so both Linux keys are BARE.
# Tagging them `+libc.musl` would state a false requirement and hide them from
# every glibc host. There is no twin to split against either: upstream ships NO
# `-unknown-linux-gnu` build for x86_64 or aarch64 (the only gnu asset is
# s390x, an unrelated arch).
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (different glibc vintage). The alpine leg IS the proof — drop
# it and the universal claim is merely asserted.
#
# A future package here whose libc measurement differs must restate this whole
# block in its own spec — see the shallow-merge warning at the top.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
