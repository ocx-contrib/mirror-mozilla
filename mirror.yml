name: sccache
target:
  registry: ocx.sh
  repository: sccache

source:
  type: github_release
  owner: mozilla
  repo: sccache
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# Linux + darwin enabled. windows staged below for a later pass.
assets:
  # ^sccache-v… anchors EXCLUDE the sccache-dist-… server bundles; the
  # \.tar\.gz$ tail EXCLUDES the .sha256 sidecars. Static musl on Linux —
  # portable across glibc + musl hosts.
  linux/amd64:
    - "^sccache-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^sccache-v.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^sccache-v.*-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^sccache-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^sccache-v.*-x86_64-pc-windows-msvc\\.tar\\.gz$"
  windows/arm64:
    - "^sccache-v.*-aarch64-pc-windows-msvc\\.tar\\.gz$"

asset_type:
  type: archive
  strip_components: 1   # wrapper dir sccache-v<v>-<target>/ → binary at content root

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "0.10.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
