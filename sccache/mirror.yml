extends: ../mirror-base.yml

name: sccache

# Logical index package `mozilla/sccache` at the physical path
# `ghcr.io/ocx-contrib/mozilla/sccache` — slash segments, never hyphen-
# flattened. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# Vendor namespace: upstream's org handle IS the vendor identity (Mozilla), so
# it names the namespace directly.
#
# Succeeds the flat `ocx.sh/sccache` coordinate this repository published before
# the grouped layout, the same way mirror-kitware/cmake succeeds mirror-cmake.
target:
  registry: ghcr.io
  repository: ocx-contrib/mozilla/sccache

source:
  type: github_release
  owner: mozilla
  repo: sccache
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream builds sccache's Linux binaries against musl and links them fully
# STATICALLY. Measured on v0.17.0:
#
#   $ file sccache            # from …-x86_64-unknown-linux-musl.tar.gz
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ file sccache            # from …-aarch64-unknown-linux-musl.tar.gz
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#   readelf -l → no PT_INTERP on either;  readelf -d → no DT_NEEDED on either
#
# No PT_INTERP and no DT_NEEDED means the artifact requires nothing of the
# host, so both Linux keys are BARE — no `+libc.*` suffix. There is no twin to
# split against: upstream publishes NO `-unknown-linux-gnu` build for x86_64 or
# aarch64 (the only gnu asset is s390x, an unrelated arch). Container legs
# (ubuntu + alpine + fedora) live in ../mirror-base.yml and are what turn that
# claim into evidence.
#
# ─── Scope (verified against every in-range release, v0.10.0 … v0.17.0) ─────
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   sccache-dist-v*-*                      — the distributed-build server, a
#                                            different product, not this package
#   *-{i686,armv7,loongarch64,riscv64gc,s390x}-*  — no GHA runner
#   *-s390x-unknown-linux-gnu.tar.gz       — the sole gnu build; unrelated arch
#   *.zip (windows)                        — redundant with the .tar.gz
#   *.sha256                               — sidecars
#
# The `^sccache-v` head is what excludes every `sccache-dist-v…` asset, and the
# `\.tar\.gz$` tail excludes the `.zip` twins and the `.sha256` sidecars.
# Resolution verified BOTH ways across all eight in-range releases: each of the
# six patterns matches EXACTLY one asset in every release — with ONE known
# exception, v0.13.0, where upstream shipped no
# `sccache-v0.13.0-x86_64-apple-darwin.tar.gz` at all. A pattern matching zero
# is silently skipped rather than an error, so v0.13.0 publishes five platforms
# and no darwin/amd64. That is upstream's gap, recorded here rather than
# discovered later; raising `versions.min` past it would discard three complete
# releases (0.10.0–0.12.0) to paper over one.
assets:
  linux/amd64:
    - "^sccache-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^sccache-v.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^sccache-v.*-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^sccache-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^sccache-v.*-x86_64-pc-windows-msvc\\.tar\\.gz$"
  windows/arm64:
    - "^sccache-v.*-aarch64-pc-windows-msvc\\.tar\\.gz$"

asset_type:
  # Every platform ships the same shape: a tarball whose single top-level entry
  # is the version- and target-stamped wrapper dir
  # `sccache-v<v>-<target>/{sccache,LICENSE,README.md}` (`sccache.exe` on
  # Windows). Stripping that one component puts the executable at the content
  # root — which is also why PATH is a bare ${installPath} and `bin_scan` is
  # `off` in ../mirror-base.yml. No per-platform override: the Windows tarball
  # has the identical layout.
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "0.10.0"
  new_per_run: 5
  poll_interval: "50 3-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: sccache/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/mozilla/sccache/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: mozilla/sccache
  fork: ocx-contrib/index
